<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIP Aneradio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        .image-container {
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/TMK7xkQP/Screenshot-2025-12-17-150736.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .text-overlay {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Impact', sans-serif;
            font-size: 72px;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <div class="text-overlay">rip aneradio</div>
    </div>
</body>
</html>
